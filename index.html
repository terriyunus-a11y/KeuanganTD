<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<!-- ============================================================
     GANTI link di bawah dengan URL Web App Anda (berakhiran /exec)
     ============================================================ -->
<script>const APP_URL = 'https://script.google.com/macros/s/AKfycbwmhOJY_hNDC4ICZoe3VMhSxxAGywTcpA4kiCpn7cORBmPmmBiLRLHq4qqhHqo4H7ow/exec';</script>

<title>Keuangan</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a6fb8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Keuangan">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html,body{margin:0;height:100%;background:#f1f6fa;overflow:hidden}
  @media (prefers-color-scheme:dark){html,body{background:#0a131c}}
  iframe{position:fixed;left:0;right:0;top:env(safe-area-inset-top);bottom:env(safe-area-inset-bottom);
    width:100%;height:calc(100% - env(safe-area-inset-top) - env(safe-area-inset-bottom));border:0;display:block}
  .splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:#0a6fb8;color:#fff;font:600 16px -apple-system,Roboto,Arial,sans-serif;transition:opacity .35s}
  .splash img{width:96px;height:96px;border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
  .splash.hide{opacity:0;pointer-events:none}
</style>
</head>
<body>
<iframe id="app" title="Keuangan" allow="clipboard-write"></iframe>
<div class="splash" id="splash"><img src="icon.svg" alt=""><div>Keuangan</div></div>
<script>
  const f = document.getElementById('app');
  f.addEventListener('load', () => setTimeout(() => document.getElementById('splash').classList.add('hide'), 300));
  f.src = APP_URL;
  setTimeout(() => document.getElementById('splash').classList.add('hide'), 8000);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
